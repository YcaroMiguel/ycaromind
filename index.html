<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YcaroMind 2.5</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://kit.fontawesome.com/aa2a6c5a4e.js" crossorigin="anonymous"></script>
</head>
<body class="dark">
    <div class="container">
        <div class="header">
            <h3>🤖 YcaroMind 2.5</h3>
            <button id="toggle-theme" title="Alternar tema"><i class="fas fa-moon"></i></button>
        </div>

        <div class="chat-container">
            <div id="chat-log"></div>
            <div class="info">
                <a href="#">Envie uma mensagem para começar</a>
            </div>
        </div>

        <div class="input-container">
            <input type="text" id="user-input" placeholder="Digite sua mensagem...">
            <button id="send-button">
                <i id="button-icon" class="fas fa-paper-plane"></i>
            </button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
