<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>YcaroMind 2.5</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <style>
    :root {
      --bg-color: #1e1e1e;
      --text-color: #f1f1f1;
      --accent-color: #3498db;
      --user-color: #2ecc71;
      --bot-color: #9b59b6;
    }
    body.light {
      --bg-color: #f0f0f0;
      --text-color: #1e1e1e;
      --accent-color: #2980b9;
    }
    * {
      box-sizing: border-box;
    }
    body {
      background: var(--bg-color);
      color: var(--text-color);
      font-family: 'Segoe UI', sans-serif;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      height: 100vh;
    }
    header {
      padding: 1rem;
      background: var(--accent-color);
      display: flex;
      justify-content: space-between;
      align-items: center;
      color: white;
    }
    #chat-log {
      flex: 1;
      overflow-y: auto;
      padding: 1rem;
    }
    .chat-box {
      display: flex;
      align-items: flex-start;
      margin-bottom: 1rem;
    }
    .icon {
      margin-right: 10px;
      font-size: 1.5rem;
    }
    .user .icon {
      color: var(--user-color);
    }
    .bot .icon {
      color: var(--bot-color);
    }
    .user, .bot {
      background: rgba(255, 255, 255, 0.1);
      padding: 0.5rem 1rem;
      border-radius: 1rem;
      max-width: 75%;
      word-wrap: break-word;
    }
    footer {
      display: flex;
      padding: 1rem;
      background: #222;
    }
    input[type="text"] {
      flex: 1;
      padding: 0.75rem;
      border-radius: 5px;
      border: none;
      font-size: 1rem;
    }
    button {
      margin-left: 0.5rem;
      padding: 0.75rem 1rem;
      background: var(--accent-color);
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      font-size: 1rem;
    }
    #settings {
      display: flex;
      align-items: center;
      gap: 1rem;
    }
  </style>
</head>
<body>
  <header>
    <div>YcaroMind 2.5</div>
    <div id="settings">
      <input type="text" id="username" placeholder="Seu nome" />
      <button onclick="toggleTheme()">🌗</button>
    </div>
  </header>

  <div id="chat-log"></div>

  <footer>
    <input type="text" id="user-input" placeholder="Digite sua pergunta..." />
    <button id="send-button"><i id="button-icon" class="fa-solid fa-paper-plane"></i></button>
  </footer>

  <script>
    const chatLog = document.getElementById('chat-log'),
      userInput = document.getElementById('user-input'),
      sendButton = document.getElementById('send-button'),
      buttonIcon = document.getElementById('button-icon');

    sendButton.addEventListener('click', sendMessage);
    userInput.addEventListener('keydown', (event) => {
      if (event.key === 'Enter') {
        sendMessage();
      }
    });

    function toggleTheme() {
      document.body.classList.toggle('light');
    }

    function sendMessage() {
      const message = userInput.value.trim();
      const username = document.getElementById('username').value || 'Você';
      if (message === '') return;

      appendMessage('user', `${username}: ${message}`);
      userInput.value = '';

      buttonIcon.classList.remove('fa-paper-plane');
      buttonIcon.classList.add('fa-spinner', 'fa-pulse');

      const options = {
        method: 'POST',
        headers: {
          'content-type': 'application/json',
          'X-RapidAPI-Key': '7e4f5a0f7fmsh9b0a8baa11636bdp15acc4jsn6ea3ede3dd13',
          'X-RapidAPI-Host': 'deepseek-v31.p.rapidapi.com'
        },
        body: {
		model: 'deepseek-v3',
		messages: [
			{
				role: 'user',
				content: 'There are ten birds in a tree. A hunter shoots one. How many are left in the tree?'
			}
		]
	}
};

      fetch('https://deepseek-v31.p.rapidapi.com/', options)
        .then(response => response.json())
        .then(response => {
          const reply = response.choices[0].message.content;
          appendMessage('bot', `YcaroMind: ${reply}`);
          resetButton();
        })
        .catch(error => {
          console.error(error);
          appendMessage('bot', 'Erro: verifique sua chave de API.');
          resetButton();
        });
    }

    function resetButton() {
      buttonIcon.classList.remove('fa-spinner', 'fa-pulse');
      buttonIcon.classList.add('fa-paper-plane');
    }

    function appendMessage(sender, message) {
      const messageElement = document.createElement('div');
      const iconElement = document.createElement('div');
      const chatElement = document.createElement('div');
      const icon = document.createElement('i');

      chatElement.classList.add("chat-box");
      iconElement.classList.add("icon");
      messageElement.classList.add(sender);
      messageElement.innerText = message;

      icon.classList.add(sender === 'user' ? 'fa-regular' : 'fa-solid', sender === 'user' ? 'fa-user' : 'fa-robot');
      iconElement.appendChild(icon);
      chatElement.appendChild(iconElement);
      chatElement.appendChild(messageElement);
      chatLog.appendChild(chatElement);

      chatLog.scrollTop = chatLog.scrollHeight;
    }
  </script>
</body>
</html>
